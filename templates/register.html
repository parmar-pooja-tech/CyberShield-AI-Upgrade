<!DOCTYPE html>
<html>
<head>
    <title>CyberShield Register</title>
</head>

<body>

    <h2>CyberShield Registration</h2>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <br><br>

        <button type="submit">Register</button>

    </form>

    <p>
        Already have an account?
        <a href="/login">Login</a>
    </p>

</body>
</html>
